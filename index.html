<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食費カウンター</title>

  <!-- 起動した瞬間に白く光らないよう、CSSを読み込む前から背景色を決めておく -->
  <meta name="color-scheme" content="light dark">
  <style>
    html { background: #f5f4f0; }
    @media (prefers-color-scheme: dark) {
      html { background: #1a1a19; }
    }
  </style>

  <!-- ホーム画面に「アプリ」として追加するための設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- スマホ上部のバーの色（ライト／ダークで切り替え） -->
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">

  <!-- 見た目は style.css に書いてある -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <!-- ===================== ホーム ===================== -->
    <section id="view-home" class="view">
      <p class="week" id="home-week"></p>
      <!-- カードは app.js がここに並べる -->
      <div id="home-cards"></div>
    </section>

    <!-- ===================== 履歴 ===================== -->
    <section id="view-history" class="view" hidden>
      <div class="period-nav">
        <button id="history-prev" aria-label="前の週">‹</button>
        <span id="history-week"></span>
        <button id="history-next" aria-label="次の週">›</button>
      </div>
      <div class="metrics" id="history-summary"></div>
      <p class="empty" id="history-empty" hidden>この週の記録はありません</p>
      <ul class="record-list" id="history-list"></ul>
    </section>

    <!-- ===================== 振り返り ===================== -->
    <section id="view-review" class="view" hidden>
      <div class="period-nav">
        <button id="review-prev" aria-label="前の月">‹</button>
        <span id="review-month"></span>
        <button id="review-next" aria-label="次の月">›</button>
      </div>

      <section class="card saved-box">
        <p class="saved-label">今月浮いた額（預金に回す目安）</p>
        <p class="saved-amount" id="review-saved"></p>
        <p class="note" id="review-saved-note"></p>
      </section>

      <h2 class="section-title">今月使った額</h2>
      <div class="metrics" id="review-summary"></div>
      <p class="month-total" id="review-total"></p>

      <h2 class="section-title">週ごとの結果</h2>
      <p class="note">月曜日がこの月に入っている週を表示しています</p>
      <div id="review-weeks"></div>
    </section>

    <!-- ===================== 設定 ===================== -->
    <section id="view-settings" class="view" hidden>
      <div id="settings-categories"></div>
      <p class="error" id="settings-error"></p>
      <button id="settings-save" class="primary-btn">設定を保存</button>

      <section class="card">
        <h2 class="section-title" style="margin-top: 4px;">バックアップ</h2>
        <p class="note">記録はこのスマホの中にだけ保存されています。週に1回くらい書き出しておくと安心です。</p>
        <p class="note" id="backup-info"></p>
        <button id="export-btn" class="sub-btn">バックアップを書き出す</button>
        <button id="import-btn" class="sub-btn">バックアップを読み込む</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </section>
    </section>
  </main>

  <!-- カード1枚分の「型」。app.js がこれをコピーして中身を埋める -->
  <template id="card-template">
    <section class="card">
      <div class="card-head">
        <span class="tag"></span>
        <span class="count"></span>
      </div>
      <div class="amount-row">
        <div>
          <span class="remain-label"></span><span class="remain"></span>
        </div>
        <span class="used"></span>
      </div>
      <div class="bar"><div class="bar-fill"></div></div>
      <div class="buttons"></div>
    </section>
  </template>

  <!-- お知らせ（記録した直後は「取り消す」付き） -->
  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo">取り消す</button>
  </div>

  <!-- 金額入力ダイアログ -->
  <dialog id="input-dialog">
    <form id="input-form">
      <p class="dialog-title" id="dialog-title"></p>
      <input id="amount-input" type="number" inputmode="numeric" placeholder="金額（円）">
      <p class="error" id="dialog-error"></p>
      <div class="dialog-buttons">
        <button type="button" id="dialog-cancel">やめる</button>
        <button type="submit" class="primary">記録する</button>
      </div>
    </form>
  </dialog>

  <!-- 確認画面（削除やバックアップ読み込みの前に出す） -->
  <dialog id="confirm-dialog">
    <p class="dialog-title" id="confirm-title"></p>
    <p class="confirm-message" id="confirm-message"></p>
    <div class="dialog-buttons">
      <button type="button" id="confirm-cancel">キャンセル</button>
      <button type="button" class="primary" id="confirm-ok">OK</button>
    </div>
  </dialog>

  <!-- 画面下のナビ。href の「#history」などで画面を切り替える -->
  <nav>
    <a href="#home"><span class="icon">🏠</span>ホーム</a>
    <a href="#history"><span class="icon">📋</span>履歴</a>
    <a href="#review"><span class="icon">📊</span>振り返り</a>
    <a href="#settings"><span class="icon">⚙️</span>設定</a>
  </nav>

  <!-- 動きは app.js に書いてある -->
  <script src="app.js"></script>
</body>
</html>
